<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1138" viewBox="0 0 1480 1138" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">西界后端总体架构</title>
<desc id="architecture-desc">目标架构。现有 App、Web 和运营入口经 HTTPS 接入同一个 NestJS API。API 与 Worker 复用 PostgreSQL、私有对象存储和 pg-boss 任务，使用 Logto OSS 身份服务，按市场接入身份提供方、支付、AI 和推送。LiveKit 实时通话按需启用。首期主栈为 TypeScript 和 SQL，Android 原生层为 Java 21。</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#566c69" stroke-width="1.45"/></marker>
 <marker id="arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1L1 5L9 9" fill="none" stroke="#566c69" stroke-width="1.45"/></marker>
</defs>
