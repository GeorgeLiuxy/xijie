services:
  social-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xijie_social
      POSTGRES_USER: xijie_social
      POSTGRES_PASSWORD: ${XIJIE_SOCIAL_DB_PASSWORD:?Set XIJIE_SOCIAL_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xijie_social -d xijie_social"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - social-db:/var/lib/postgresql/data
volumes:
  social-db:
networks:
  default:
    external: true
    name: xijie-identity-dev_default
