services:
  memories-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xijie_memories
      POSTGRES_USER: xijie_memories
      POSTGRES_PASSWORD: ${XIJIE_MEMORIES_DB_PASSWORD:?Set XIJIE_MEMORIES_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xijie_memories -d xijie_memories"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - memories-db:/var/lib/postgresql/data
volumes:
  memories-db:
networks:
  default:
    external: true
    name: xijie-identity-dev_default
